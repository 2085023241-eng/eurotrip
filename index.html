const BOOKINGS=[['12/26','罗马斗兽场 · Colosseum','https://ticketing.colosseo.it/en/'],['12/27','学院美术馆 · Accademia','https://www.galleriaaccademiafirenze.it/en/'],['12/28','圣马可大教堂 · St Mark’s Basilica','https://basilicasanmarco.skiperformance.com/en/store'],['12/28','总督宫 · Doge’s Palace','https://palazzoducale.visitmuve.it/en/'],['12/30','Jungfrau / First region','https://www.jungfrau.ch/en-gb/'],['1/2','卢浮宫 · Louvre','https://www.louvre.fr/en/visit'],['1/6','圣家堂 · Sagrada Família','https://sagradafamilia.org/en/schedules-how-to-get'],['1/6','桂尔公园 · Park Güell','https://parkguell.barcelona/en/planning-your-visit/prices-and-times'],['1/8','马德里王宫 · Royal Palace','https://tickets.patrimonionacional.es/en/tickets/palacio-real-de-madrid'],['1/8','普拉多博物馆 · Prado','https://www.museodelprado.es/en/visit/opening-times-and-prices/']];
const STAYS=['罗马 · Rome · Monti / Termini','佛罗伦萨 · Florence · SMN / Duomo','米兰 · Milan · Centrale','卢塞恩 · Lucerne · Old Town','格林德瓦 · Grindelwald','巴黎 · Paris · 中心区','尼斯 · Nice · Nice-Ville / Old Town','巴塞罗那 · Barcelona · Eixample','马德里 · Madrid · Centro / Atocha'];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let selectedDay=+(localStorage.getItem('eurotrip-day')||1);
function iconFor(n){if(/早餐|午餐|晚餐|Brunch|咖啡/.test(n))return'☕';if(/睡眠/.test(n))return'☾';if(/→|TGV|AVE|直飞/.test(n))return'→';if(/起床|退房|入住/.test(n))return'⌂';return'●'}
function timeline(x){return `<div class="timeline">${x.items.map(([t,n])=>`<div class="trow"><span class="time">${t}</span><span class="ico">${iconFor(n)}</span><span><b>${n}</b></span></div>`).join('')}</div>`}
function go(view){$$('.view').forEach(x=>x.classList.toggle('active',x.id===view));$$('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));location.hash=view;render(view);scrollTo({top:0,behavior:'smooth'})}
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
function renderOverview(){const el=$('#overview');el.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">24 DEC 2026 → 09 JAN 2027</div><h1>15天，四个国家。</h1><p>圣诞从罗马开始，跨年在巴黎，最后从马德里返程。核心游玩日为 12/25–1/8；去程和返程不计入15天。</p><div class="chips">${COUNTRIES.map(c=>`<span class="chip">${c[0]} · ${c[1]}</span>`).join('')}</div></div><div class="visual"><div class="route-art"><svg viewBox="0 0 520 260" aria-label="欧洲行程示意图"><path d="M65 180 C130 125,145 185,205 135 S285 70,325 120 S395 210,455 135" fill="none" stroke="#f1d7cf" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 10"/><g fill="#fffdf9" stroke="#d96f55" stroke-width="5"><circle cx="65" cy="180" r="11"/><circle cx="205" cy="135" r="11"/><circle cx="325" cy="120" r="11"/><circle cx="455" cy="135" r="11"/></g><g fill="#fffdf9" font-size="14" font-family="sans-serif"><text x="45" y="215">Italy</text><text x="174" y="105">Switzerland</text><text x="305" y="88">France</text><text x="438" y="170">Spain</text></g></svg></div></div></section><h2>国家路线</h2><div class="country-grid">${COUNTRIES.map(c=>`<div class="country-card"><h3>${c[0]}</h3><p>${c[1]}<br>${c[2]}</p></div>`).join('')}</div><h2>15天总览</h2><div class="list">${DAYS.map(x=>`<div class="row"><span class="num">DAY ${x.d}<br>${x.date}</span><span><b>${x.title}</b><small>${x.hotel}</small></span><button class="small-btn" data-open-day="${x.d}">打开</button></div>`).join('')}</div>`;$$('[data-open-day]').forEach(b=>b.onclick=()=>{selectedDay=+b.dataset.openDay;localStorage.setItem('eurotrip-day',selectedDay);go('schedule')})}
function isDone(d,i){return localStorage.getItem(`done-${d}-${i}`)==='1'}
function renderToday(){let d=+(localStorage.getItem('eurotrip-today')||1),x=DAYS.find(z=>z.d===d)||DAYS[0];let nextIndex=x.stops.findIndex((s,i)=>!isDone(x.d,i));if(nextIndex<0)nextIndex=x.stops.length-1;let next=x.stops[nextIndex];let nextTime=(x.items.find(y=>y[1].includes(next))||['',''])[0];$('#today').innerHTML=`<div class="today-head"><div><div class="eyebrow">TODAY</div><h1 class="page-title">今天只看这一页。</h1></div><select id="daySelect">${DAYS.map(z=>`<option value="${z.d}" ${z.d===x.d?'selected':''}>Day ${z.d} · ${z.date} · ${z.title}</option>`).join('')}</select></div><div class="next"><div><small>NEXT · DAY ${x.d}</small><strong>${nextTime}</strong><h2>${next}</h2><p>${x.hotel}</p></div></div>${timeline(x)}<div class="checks">${x.stops.map((s,i)=>`<button class="check ${isDone(x.d,i)?'done':''}" data-check="${i}">${isDone(x.d,i)?'✓':'○'} ${s}</button>`).join('')}</div>`;$('#daySelect').onchange=e=>{localStorage.setItem('eurotrip-today',e.target.value);renderToday()};$$('#today [data-check]').forEach(b=>b.onclick=()=>{let k=`done-${x.d}-${b.dataset.check}`;localStorage.setItem(k,localStorage.getItem(k)==='1'?'0':'1');renderToday()})}
function renderSchedule(){let x=DAYS.find(z=>z.d===selectedDay)||DAYS[0];$('#schedule').innerHTML=`<div class="eyebrow">ITINERARY</div><h1 class="page-title">15天行程</h1><div class="day-tabs">${DAYS.map(z=>`<button class="daytab ${z.d===x.d?'active':''}" data-day="${z.d}">Day ${z.d} · ${z.date}</button>`).join('')}</div><h2>${x.title}</h2><div class="glance"><div class="card"><small>Hotel</small><b>${x.hotel}</b></div><div class="card"><small>Wake / Sleep</small><b>${x.wake} → ${x.sleep}</b></div><div class="card"><small>Country</small><b>${x.country}</b></div><div class="card"><small>Stops</small><b>${x.stops.length} 个核心节点</b></div></div>${timeline(x)}<details class="options"><summary>备选景点 (${x.opt.length}项，默认不进入主计划)</summary>${x.opt.map((o,i)=>{let k=`watch-${x.d}-${i}`,on=localStorage.getItem(k)==='1';return`<div class="opt"><b>${o}</b><p>仅作为替换/观察项，不自动进入当天时间轴。</p><button class="watch ${on?'on':''}" data-watch="${i}">${on?'★ 已关注':'☆ 关注'}</button></div>`}).join('')}</details>`;$$('#schedule [data-day]').forEach(b=>b.onclick=()=>{selectedDay=+b.dataset.day;localStorage.setItem('eurotrip-day',selectedDay);renderSchedule()});$$('#schedule [data-watch]').forEach(b=>b.onclick=()=>{let k=`watch-${x.d}-${b.dataset.watch}`;localStorage.setItem(k,localStorage.getItem(k)==='1'?'0':'1');renderSchedule()})}
function renderDesk(){let cross=DAYS.filter(x=>x.title.includes('→'));$('#desk').innerHTML=`<div class="eyebrow">TRIP DESK</div><h1 class="page-title">只管理需要提前处理的事项。</h1><div class="desk-tabs"><button class="active" data-tab="book">预约</button><button data-tab="stay">住宿</button><button data-tab="move">跨城交通</button></div><section class="desk-panel active" id="panel-book"><div class="list">${BOOKINGS.map(x=>`<div class="manage-row"><span><b>${x[1]}</b><small>${x[0]}</small></span><a class="small-btn" href="${x[2]}" target="_blank" rel="noopener">官网</a></div>`).join('')}</div></section><section class="desk-panel" id="panel-stay"><div class="list">${STAYS.map(s=>`<div class="manage-row"><b>${s}</b><span class="chip">住宿</span></div>`).join('')}</div></section><section class="desk-panel" id="panel-move"><div class="list">${cross.map(x=>`<div class="manage-row"><span><b>Day ${x.d} · ${x.title}</b><small>${x.date}</small></span><span class="chip">跨城</span></div>`).join('')}</div></section>`;$$('#desk [data-tab]').forEach(b=>b.onclick=()=>{$$('#desk [data-tab]').forEach(x=>x.classList.toggle('active',x===b));$$('.desk-panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+b.dataset.tab))})}
function showModal(title,html){$('#modalBody').innerHTML=`<h2>${title}</h2>${html}`;$('#modal').classList.add('show')}
function installHelp(){showModal('安装 EuroTrip','<p>iPhone：用 Safari 打开本站 → 分享 → 添加到主屏幕。</p><p>Android：用 Chrome 打开 → 菜单 → 安装应用 / 添加到主屏幕。</p>')}
function renderMore(){$('#more').innerHTML=`<div class="eyebrow">MORE</div><h1 class="page-title">低频功能</h1><div class="notice">敏感证件、护照扫描件和真实票据不要上传到公开 GitHub Pages。这里只保留旅行操作提示。</div><div class="more-grid" style="margin-top:12px"><button class="tile" data-info="check"><b>出发清单</b><p>证件、衣物、行李</p></button><button class="tile" data-info="docs"><b>票据文件</b><p>隐私优先</p></button><button class="tile" data-info="budget"><b>预算</b><p>预算与支出</p></button><button class="tile" data-info="split"><b>三人分账</b><p>同行费用结算</p></button><button class="tile" data-info="install"><b>安装到手机</b><p>iPhone / Android</p></button><button class="tile" data-info="sync"><b>状态与备份</b><p>本机 LocalStorage</p></button></div>`;$$('#more [data-info]').forEach(b=>b.onclick=()=>{let k=b.dataset.info;if(k==='install')return installHelp();let map={check:['出发清单','<p>护照、签证、保险、银行卡、转换插头、充电宝、冬季保暖层、常用药、全部电子票。</p>'],docs:['票据文件','<p>建议保存在手机 Files / Wallet 或私有云盘，不上传公开站点。</p>'],budget:['预算','<p>目标预算约 ¥20,000–25,000/人；圣诞、跨年与瑞士冬季住宿是主要波动项。</p>'],split:['三人分账','<p>建议统一付款人并每天晚间一次结算，减少旅行中频繁记账。</p>'],sync:['状态与备份','<p>Today 完成状态和备选景点关注状态保存在当前浏览器 LocalStorage。清除浏览器数据会重置。</p>']};showModal(...map[k])})}
function render(v){if(v==='overview')renderOverview();if(v==='today')renderToday();if(v==='schedule')renderSchedule();if(v==='desk')renderDesk();if(v==='more')renderMore()}
$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').classList.remove('show')});
let installPrompt;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});$('#install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else installHelp()};
function net(){let on=navigator.onLine;$('#net').textContent=on?'Online':'Offline';$('#net').style.color=on?'var(--ok)':'var(--accent)'}addEventListener('online',net);addEventListener('offline',net);net();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
let initial=(location.hash||'#overview').slice(1);if(!['overview','today','schedule','desk','more'].includes(initial))initial='overview';go(initial);
</script>
